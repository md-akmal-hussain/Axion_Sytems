name: Terraform-Pipeline-$(Date:yyyyMMdd)-$(Rev:r)

trigger: none
  
pr: none

variables:
  - group: Terraform-Variables

  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/environments/dev'

  - name: serviceConnection
    value: 'Yaml_Svc'  

  - name: poolName
    value: 'Yaml_Pool' 

  - name: INFRACOST_API_KEY
    value: '$(INFRACOST_API_KEY)'

  - name: ResourceGroupName
    value: 'pipelinestg'

  - name: StorageAccountName
    value: 'stgnagpipeline'

  - name: ContainerName
    value: 'yaml-container' 

  - name: ResumeFrom
    value: 'TerraformInitAndValidateFmt'

stages:

  - stage: ResumeDecision
    displayName: 'Resume Decision'

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:

      - job: DetectResumeStage
        displayName: Detect Previous Failed Stage

        steps:

          - task: PowerShell@2
            name: SetResumeStage
            displayName: 'Detect Resume Stage'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

            inputs:
              targetType: inline

              script: |

                $ErrorActionPreference = "Stop"

                Write-Host "=========================================="
                Write-Host "Checking Previous Pipeline Run"
                Write-Host "=========================================="

                $organization = "$(System.CollectionUri)"
                $project      = "$(System.TeamProject)"
                $definitionId = "$(System.DefinitionId)"
                $currentBuild = "$(Build.BuildId)"
                $branch       = "$(Build.SourceBranch)"

                Write-Host "Current Build : $currentBuild"
                Write-Host "Branch        : $branch"
                Write-Host "Definition ID : $definitionId"

                $headers = @{
                    Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
                }

                $encodedBranch = [System.Uri]::EscapeDataString($branch)

                $buildUrl = "${organization}${project}/_apis/build/builds?definitions=$definitionId&branchName=$encodedBranch&queryOrder=finishTimeDescending&`$top=10&api-version=7.1"

                Write-Host "Getting previous builds..."

                $builds = Invoke-RestMethod `
                  -Uri $buildUrl `
                  -Headers $headers `
                  -Method Get

                $previousBuild = $builds.value |
                  Where-Object { $_.id -ne [int]$currentBuild } |
                  Select-Object -First 1

                $resumeStage = "TerraformInitAndValidateFmt"

                if ($null -eq $previousBuild) {

                    Write-Host "No previous build found."
                    Write-Host "Starting from TerraformInitAndValidateFmt."

                }
                else {

                    Write-Host "Previous Build ID : $($previousBuild.id)"
                    Write-Host "Previous Build Result : $($previousBuild.result)"

                    $timelineUrl = "${organization}${project}/_apis/build/builds/$($previousBuild.id)/timeline?api-version=7.1"

                    Write-Host "Getting previous build timeline..."

                    $timeline = Invoke-RestMethod `
                      -Uri $timelineUrl `
                      -Headers $headers `
                      -Method Get

                    $stageRecords = $timeline.records |
                      Where-Object {
                        $_.type -eq "Stage"
                      }

                    foreach ($stage in $stageRecords) {

                        Write-Host "Stage: $($stage.name) | Result: $($stage.result)"
                    }

                    $stageOrder = @(
                      "TerraformInitAndValidateFmt",
                      "SecurityScan",
                      "TerraformPlan",
                      "Infracost",
                      "ManualApproval",
                      "TerraformApply"
                    )

                    foreach ($stageName in $stageOrder) {

                        $record = $stageRecords |
                          Where-Object { $_.name -eq $stageName } |
                          Select-Object -First 1

                        if ($null -eq $record) {

                            Write-Host "Stage '$stageName' was not found."
                            $resumeStage = $stageName
                            break
                        }

                        if ($record.result -in @("failed","canceled","abandoned")) {

                            $resumeStage = $stageName

                            Write-Host ""
                            Write-Host "=========================================="
                            Write-Host "FAILED STAGE FOUND"
                            Write-Host "Resume From : $resumeStage"
                            Write-Host "=========================================="

                            break
                        }
                    }

                    if ($previousBuild.result -eq "succeeded") {

                        Write-Host ""
                        Write-Host "Previous pipeline succeeded."
                        Write-Host "Starting new run from beginning."

                        $resumeStage = "TerraformInitAndValidateFmt"
                    }
                }

                Write-Host ""
                Write-Host "FINAL RESUME STAGE = $resumeStage"

                Write-Host "##vso[task.setvariable variable=ResumeStage;isOutput=true]$resumeStage"

  - stage: TerraformInitAndValidateFmt
    group: Terragorm
    displayName: Terraform Initialization And Validation
    

    isSkippable: false
    lockBehavior: sequential
    

    pool:
      name: $(poolName)
       
    jobs:

      - job: Job1_TerraformInitAndValidateAndFormating
        displayName: Terraform Initialization And Validation And Formatting

        dependsOn:
          - ResumeDecision

        condition: |
          and(
            succeeded(),
            eq(
              dependencies.ResumeDecision.outputs['DetectResumeStage.SetResumeStage.ResumeStage'],
              'TerraformInitAndValidateFmt'
            )
          )

        steps:
        - task: TerraformTask@5
          displayName: Terraform Initialization
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(ResourceGroupName)'
            backendAzureRmStorageAccountName: '$(StorageAccountName)'
            backendAzureRmContainerName: '$(ContainerName)'
            backendAzureRmKey: 'dev.terraform.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Validation
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(terraformWorkingDirectory)'

        - task: TerraformTask@5
          displayName: Terraform Formatting
          inputs:
            provider: 'azurerm'
            command: 'custom'
            workingDirectory: '$(terraformWorkingDirectory)'
            outputTo: 'console'
            customCommand: 'fmt'
            environmentServiceNameAzureRM: '$(serviceConnection)'

  - stage: SecurityScan
    displayName: Security Scan

    dependsOn:
      - ResumeDecision
      - TerraformInitAndValidateFmt

    condition: |
       and(
          in(dependencies.ResumeDecision.result, 'Succeeded'),
          in(dependencies.TerraformInitAndValidateFmt.result, 'Succeeded', 'Skipped'),
          in(
            dependencies.ResumeDecision.outputs['DetectResumeStage.SetResumeStage.ResumeStage'],
            'TerraformInitAndValidateFmt',
            'SecurityScan'
          )
        )

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:

      - job: TerraformSecurityScan
        displayName: Security Scanning

        steps:

          # ==========================================
          # TFLINT
          # ==========================================

          - task: PowerShell@2
            displayName: TFLint
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running TFLint..."
                tflint --init
                tflint


          # ==========================================
          # CHECKOV
          # ==========================================

          - task: PowerShell@2
            displayName: Checkov
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running Checkov..."
                checkov -d . --soft-fail --quiet


          # ==========================================
          # TFSEC
          # ==========================================

          - task: PowerShell@2
            displayName: tfsec
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running tfsec..."
                tfsec .


          # ==========================================
          # TERRASCAN
          # ==========================================

          - task: PowerShell@2
            displayName: Terrascan
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running Terrascan..."
                terrascan scan -t azure --soft-fail
                exit 0


          # ==========================================
          # GITLEAKS
          # ==========================================

          - task: PowerShell@2
            displayName: Gitleaks Secret Scan
            inputs:
              targetType: inline
              script: |
                Write-Host "Running Gitleaks..."
                gitleaks detect --source "$(Build.SourcesDirectory)" --no-banner --exit-code 0


          # ==========================================
          # TRUFFLEHOG
          # ==========================================

          - task: PowerShell@2
            displayName: TruffleHog Secret Scan
            inputs:
              targetType: inline
              script: |
                Write-Host "Running TruffleHog..."
                trufflehog filesystem "$(Build.SourcesDirectory)"
                exit 0  

  - stage: TerraformPlan
    displayName: Terraform Plan

    dependsOn:
      - ResumeDecision
      - TerraformInitAndValidateFmt
      - SecurityScan

    condition: |
      and(
        in(dependencies.ResumeDecision.result, 'Succeeded'),
        in(dependencies.TerraformInitAndValidateFmt.result, 'Succeeded', 'Skipped'),
        in(dependencies.SecurityScan.result, 'Succeeded', 'Skipped'),
        in(
          dependencies.ResumeDecision.outputs['DetectResumeStage.SetResumeStage.ResumeStage'],
          'TerraformInitAndValidateFmt',
          'SecurityScan',
          'TerraformPlan'
        )
      )

    isSkippable:  false
    lockBehavior: sequential


    pool:
      name: $(poolName)
    jobs:

      - job: Job1_TerraformInitAndPlan
        displayName: TerraformInit And Plan
        steps:

        - task: TerraformTask@5
          displayName: Terraform Initialization
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(ResourceGroupName)'
            backendAzureRmStorageAccountName: '$(StorageAccountName)'
            backendAzureRmContainerName: '$(ContainerName)'
            backendAzureRmKey: 'dev.terraform.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(terraformWorkingDirectory)'
            environmentServiceNameAzureRM: '$(serviceConnection)'
            commandOptions: '-out=tfplan'

        - task: PowerShell@2
          displayName: Create Terraform Plan JSON
          inputs:
            targetType: inline
            workingDirectory: '$(terraformWorkingDirectory)'
            script: |
              Write-Host "Converting Terraform plan to JSON..."

              terraform show -json tfplan > tfplan.json

              Write-Host "Terraform Plan JSON created:"
              Get-Item tfplan.json  
              
  - stage: Infracost
    displayName: 'Infracost Cost Estimation'

    dependsOn:
      - ResumeDecision
      - TerraformInitAndValidateFmt
      - SecurityScan
      - TerraformPlan

    condition: |
      and(
        in(dependencies.ResumeDecision.result, 'Succeeded'),
        in(dependencies.TerraformInitAndValidateFmt.result, 'Succeeded', 'Skipped'),
        in(dependencies.SecurityScan.result, 'Succeeded', 'Skipped'),
        in(dependencies.TerraformPlan.result, 'Succeeded', 'Skipped'),
        in(
          dependencies.ResumeDecision.outputs['DetectResumeStage.SetResumeStage.ResumeStage'],
          'TerraformInitAndValidateFmt',
          'SecurityScan',
          'TerraformPlan',
          'Infracost'
        )
      )

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:
      - job: InfracostJob
        displayName: 'Infracost Cost Estimation'
        steps:

          - task: PowerShell@2
            displayName: 'Run Infracost'
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running Infracost..."

                infracost breakdown `
                  --path "$(Pipeline.Workspace)/terraform-plan/tfplan.json" `
                  --format json `
                  --out-file "$(Pipeline.Workspace)/terraform-plan/infracost.json"

                infracost output `
                  --path "$(Pipeline.Workspace)/terraform-plan/infracost.json" `
                  --format table
            env:
              INFRACOST_API_KEY: $(INFRACOST_API_KEY)  
                  
  - stage: ManualApproval
    displayName: 'Manual Approval Before Main Merge'

    dependsOn:
    - Infracost

    condition: succeeded()

    isSkippable: false
    lockBehavior: sequential

    jobs:

      - job: ManualApprovalJob
        displayName: 'Manual Approval'
        pool: server
        timeoutInMinutes: 1440

        steps:

        - task: ManualValidation@1
          displayName: 'Approve Feature Branch For Main Merge'
          inputs:
            notifyUsers: |
              $(Build.RequestedForEmail)

            instructions: |
              Terraform validation and plan completed successfully.

              Please review the Terraform Plan.

              Approve this step only if the changes are ready
              to be merged into the main branch.

            onTimeout: 'reject'

  - stage: TerraformApply
    displayName: 'Terraform Apply'

    dependsOn:
      - ResumeDecision
      - TerraformInitAndValidateFmt
      - SecurityScan
      - TerraformPlan
      - Infracost
      - ManualApproval

    condition: |
      and(
        in(dependencies.ResumeDecision.result, 'Succeeded'),
        in(dependencies.TerraformInitAndValidateFmt.result, 'Succeeded', 'Skipped'),
        in(dependencies.SecurityScan.result, 'Succeeded', 'Skipped'),
        in(dependencies.TerraformPlan.result, 'Succeeded', 'Skipped'),
        in(dependencies.Infracost.result, 'Succeeded', 'Skipped'),
        in(dependencies.ManualApproval.result, 'Succeeded', 'Skipped'),
        in(
          dependencies.ResumeDecision.outputs['DetectResumeStage.SetResumeStage.ResumeStage'],
          'TerraformInitAndValidateFmt',
          'SecurityScan',
          'TerraformPlan',
          'Infracost',
          'ManualApproval',
          'TerraformApply'
        )
      )

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:

      - job: Job1_TerraformApply
        displayName: Terraform Apply
        steps:
        - task: TerraformTask@5
          displayName: Terraform Initialization
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(ResourceGroupName)'
            backendAzureRmStorageAccountName: '$(StorageAccountName)'
            backendAzureRmContainerName: '$(ContainerName)'
            backendAzureRmKey: 'dev.terraform.tfstate'        

        - task: TerraformTask@5
          displayName: Terraform Apply
          inputs:
            provider: 'azurerm'
            commandOptions: '-auto-approve' 
            command: 'apply'
            workingDirectory: '$(terraformWorkingDirectory)'
            environmentServiceNameAzureRM: '$(serviceConnection)'     