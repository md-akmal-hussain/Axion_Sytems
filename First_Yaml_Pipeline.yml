name: Terraform-Pipeline-$(Date:yyyyMMdd)-$(Rev:r)

trigger:
  branches:
    include:
      - features/*
  
pr: none

variables:
  - group: Terraform-Variables

  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/environments/dev'

  - name: serviceConnection
    value: 'Yaml_Svc'  

  - name: poolName
    value: 'Yaml_Pool' 

  - name: ResourceGroupName
    value: 'pipelinestg'

  - name: StorageAccountName
    value: 'stgnagpipeline'

  - name: ContainerName
    value: 'yaml-container'         

stages:

  - stage: TerraformInitAndValidateFmt
    group: Terragorm
    displayName: Terraform Initialization And Validation
    

    isSkippable: false
    lockBehavior: sequential
    

    pool:
      name: $(poolName)
       
    jobs:

      - job: Job1_TerraformInitAndValidateAndFormating
        displayName: Terraform Initialization And Validation And Formatting
        steps:
        - task: TerraformTask@5
          displayName: Terraform Initialization
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(ResourceGroupName)'
            backendAzureRmStorageAccountName: '$(StorageAccountName)'
            backendAzureRmContainerName: '$(ContainerName)'
            backendAzureRmKey: 'dev.terraform.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Validation
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(terraformWorkingDirectory)'

        - task: TerraformTask@5
          displayName: Terraform Formatting
          inputs:
            provider: 'azurerm'
            command: 'custom'
            workingDirectory: '$(terraformWorkingDirectory)'
            outputTo: 'console'
            customCommand: 'fmt'
            environmentServiceNameAzureRM: '$(serviceConnection)'

  - stage: SecurityScan
    displayName: Security Scan

    dependsOn:
      - TerraformInitAndValidateFmt

    condition: succeeded()

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:

      - job: TerraformSecurityScan
        displayName: Security Scanning

        steps:

          # ==========================================
          # TFLINT
          # ==========================================

          - task: PowerShell@2
            displayName: TFLint
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running TFLint..."
                tflint --init
                tflint
                exit 0


          # ==========================================
          # CHECKOV
          # ==========================================

          - task: PowerShell@2
            displayName: Checkov
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running Checkov..."
                checkov -d . --soft-fail --quiet


          # ==========================================
          # TFSEC
          # ==========================================

          - task: PowerShell@2
            displayName: tfsec
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running tfsec..."
                tfsec .


          # ==========================================
          # TERRASCAN
          # ==========================================

          - task: PowerShell@2
            displayName: Terrascan
            inputs:
              targetType: inline
              workingDirectory: '$(terraformWorkingDirectory)'
              script: |
                Write-Host "Running Terrascan..."
                terrascan scan -t azure --soft-fail
                exit 0


          # ==========================================
          # GITLEAKS
          # ==========================================

          - task: PowerShell@2
            displayName: Gitleaks Secret Scan
            inputs:
              targetType: inline
              script: |
                Write-Host "Running Gitleaks..."
                gitleaks detect --source "$(Build.SourcesDirectory)" --no-banner --exit-code 0


          # ==========================================
          # TRUFFLEHOG
          # ==========================================

          - task: PowerShell@2
            displayName: TruffleHog Secret Scan
            inputs:
              targetType: inline
              script: |
                Write-Host "Running TruffleHog..."
                trufflehog filesystem "$(Build.SourcesDirectory)"
                exit 0  

  - stage: TerraformPlan
    displayName: Terraform Plan

    dependsOn:
      - SecurityScan

    condition: succeeded()

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:

    - job: Job1_TerraformInitAndPlan
      displayName: TerraformInit And Plan

      steps:

        # ====================================================
        # Terraform Init
        # ====================================================

        - task: TerraformTask@5
          displayName: Terraform Initialization
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(ResourceGroupName)'
            backendAzureRmStorageAccountName: '$(StorageAccountName)'
            backendAzureRmContainerName: '$(ContainerName)'
            backendAzureRmKey: 'dev.terraform.tfstate'


        # ====================================================
        # Terraform Plan
        # ====================================================

        - task: TerraformTask@5
          displayName: Terraform Plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(terraformWorkingDirectory)'
            environmentServiceNameAzureRM: '$(serviceConnection)'
            commandOptions: '-out=tfplan'


        # ====================================================
        # Verify tfplan
        # ====================================================

        - task: PowerShell@2
          displayName: Verify Terraform Plan
          inputs:
            targetType: inline
            workingDirectory: '$(terraformWorkingDirectory)'
            script: |
              Write-Host "Checking Terraform plan file..."

              $planFile = "$(terraformWorkingDirectory)\tfplan"

              Write-Host "Expected plan file:"
              Write-Host $planFile

              if (Test-Path $planFile) {

                  Write-Host "========================================="
                  Write-Host "tfplan FOUND"
                  Write-Host "========================================="

                  Get-Item $planFile

              }
              else {

                  Write-Error "tfplan NOT FOUND"
                  exit 1

              }


        # ====================================================
        # Create Terraform Plan JSON
        # ====================================================

        - task: PowerShell@2
          displayName: Create Terraform Plan JSON
          inputs:
            targetType: inline
            workingDirectory: '$(terraformWorkingDirectory)'
            script: |
              Write-Host "Converting Terraform plan to JSON..."

              $planFile = "$(terraformWorkingDirectory)\tfplan"
              $jsonFile = "$(terraformWorkingDirectory)\tfplan.json"

              if (!(Test-Path $planFile)) {

                  Write-Error "tfplan file not found."
                  exit 1

              }

              # Generate Terraform Plan JSON
              cmd /c "terraform show -json tfplan > tfplan.json"

              if (!(Test-Path $jsonFile)) {

                  Write-Error "tfplan.json was not created."
                  exit 1

              }

              $file = Get-Item $jsonFile

              Write-Host "========================================="
              Write-Host "Terraform Plan JSON Created"
              Write-Host "========================================="

              Write-Host "File:"
              Write-Host $file.FullName

              Write-Host "Size:"
              Write-Host "$($file.Length) bytes"

              if ($file.Length -eq 0) {

                  Write-Error "tfplan.json is EMPTY."
                  exit 1

              }


        # ====================================================
        # Publish Terraform Plan JSON
        # ====================================================

        - task: PublishPipelineArtifact@1
          displayName: Publish Terraform Plan JSON
          inputs:
            targetPath: '$(terraformWorkingDirectory)/tfplan.json'
            artifact: 'terraform-plan'
            publishLocation: 'pipeline'
              
  - stage: Infracost
    displayName: 'Infracost Cost Estimation'

    dependsOn:
      - TerraformPlan

    condition: succeeded()

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:

      - job: InfracostJob
        displayName: 'Infracost Cost Estimation'

        steps:

          # ==========================================
          # DOWNLOAD TERRAFORM PLAN ARTIFACT
          # ==========================================

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'


          # ==========================================
          # VERIFY ARTIFACT
          # ==========================================

          - task: PowerShell@2
            displayName: 'Verify Terraform Plan JSON'
            inputs:
              targetType: inline
              script: |

                Write-Host "Checking Terraform Plan JSON..."

                $planFile = "$(Pipeline.Workspace)\terraform-plan\tfplan.json"

                Write-Host "Expected file:"
                Write-Host $planFile

                if (Test-Path $planFile) {

                    Write-Host "========================================="
                    Write-Host "tfplan.json FOUND"
                    Write-Host "========================================="

                    Get-Item $planFile

                }
                else {

                    Write-Error "tfplan.json NOT FOUND"
                    exit 1
                }


          # ==========================================
          # RUN INFRACOST
          # ==========================================

          - task: PowerShell@2
            displayName: 'Run Infracost'
            inputs:
              targetType: inline
              script: |

                Write-Host "Running Infracost..."

                $planFile = "$(Pipeline.Workspace)\terraform-plan\tfplan.json"
                $outputDir = "$(Pipeline.Workspace)\terraform-plan"

                if (!(Test-Path $outputDir)) {
                    New-Item -ItemType Directory -Path $outputDir -Force
                }

                infracost breakdown `
                  --path "$planFile" `
                  --format json `
                  --out-file "$outputDir\infracost.json"

                if ($LASTEXITCODE -ne 0) {

                    Write-Error "Infracost breakdown failed."
                    exit $LASTEXITCODE
                }

                Write-Host "Infracost JSON created."

                Get-Item "$outputDir\infracost.json"

                infracost output `
                  --path "$outputDir\infracost.json" `
                  --format table

            env:
              INFRACOST_API_KEY: $(INFRACOST_API_KEY)   ## define in  ADO pipeline variables
                  
  - stage: ManualApproval
    displayName: 'Manual Approval Before Main Merge'

    dependsOn:
    - Infracost

    condition: succeeded()

    isSkippable: false
    lockBehavior: sequential

    jobs:

      - job: ManualApprovalJob
        displayName: 'Manual Approval'
        pool: server
        timeoutInMinutes: 1440

        steps:

        - task: ManualValidation@1
          displayName: 'Approve Feature Branch For Main Merge'
          inputs:
            notifyUsers: |
              $(Build.RequestedForEmail)

            instructions: |
              Terraform validation and plan completed successfully.

              Please review the Terraform Plan.

              Approve this step only if the changes are ready
              to be merged into the main branch.

            onTimeout: 'reject'

  - stage: TerraformApply
    displayName: 'Terraform Apply'

    dependsOn:
      - ManualApproval
    condition: eq(1, 2)  ### skipped ###

    isSkippable: false
    lockBehavior: sequential

    pool:
      name: $(poolName)

    jobs:

      - job: Job1_TerraformApply
        displayName: Terraform Apply
        steps:
        - task: TerraformTask@5
          displayName: Terraform Initialization
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(terraformWorkingDirectory)'
            backendServiceArm: '$(serviceConnection)'
            backendAzureRmResourceGroupName: '$(ResourceGroupName)'
            backendAzureRmStorageAccountName: '$(StorageAccountName)'
            backendAzureRmContainerName: '$(ContainerName)'
            backendAzureRmKey: 'dev.terraform.tfstate'        

        - task: TerraformTask@5
          displayName: Terraform Apply
          inputs:
            provider: 'azurerm'
            commandOptions: '-auto-approve' 
            command: 'apply'
            workingDirectory: '$(terraformWorkingDirectory)'
            environmentServiceNameAzureRM: '$(serviceConnection)'     